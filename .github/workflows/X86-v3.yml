#
# X86 bridge-ready build: Passwall + ZeroTier + LAN IP 10.1.1.99
# Based on X86-v2.yml; configure bridge ports and proxy rules after flashing.
#

name: build artifact X86-v3

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: echo "VERSION=x86-v3-$(date +%Y%m%d)-$(git log --pretty=format:'%h' -1)" >> $GITHUB_OUTPUT

      - name: Space cleanup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi `docker images -q` || true
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* snap* || true
          sudo -E apt update
          sudo -E apt full-upgrade -y
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          df -h

      - name: Configure Passwall feeds
        run: |
          # Use Passwall without the overlapping helloworld feed in this build.
          sed -i '/^src-git[[:space:]]\+helloworld[[:space:]]/d' feeds.conf.default
          sed -i '/^src-git[[:space:]]\+passwall_packages[[:space:]]/d; /^src-git[[:space:]]\+passwall[[:space:]]/d' feeds.conf.default
          # Ensure the existing last line is terminated before appending feeds.
          printf '\n' >> feeds.conf.default
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          EOF

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration file
        run: |
          rm -f ./.config*
          touch ./.config
          #
          # ========================固件定制部分（精简版）========================
          # 目标：Passwall + ZeroTier + 桥接代理依赖；网口和代理策略刷机后配置
          #
          cat >> .config <<EOF
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          # CONFIG_VMDK_IMAGES is not set

          # 基础工具
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_LIBCURL_COOKIES=y
          CONFIG_LIBCURL_FILE=y
          CONFIG_LIBCURL_FTP=y
          CONFIG_LIBCURL_HTTP=y
          CONFIG_LIBCURL_MBEDTLS=y
          CONFIG_LIBCURL_NO_SMB="!"
          CONFIG_LIBCURL_PROXY=y

          # LuCI
          CONFIG_PACKAGE_luci=y

          # Passwall（feeds: passwall / passwall_packages）
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
          # CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy is not set
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          # CONFIG_PACKAGE_luci-app-ssr-plus is not set

          # 与 LEDE 默认 firewall3 保持一致，避免混用 firewall4
          CONFIG_PACKAGE_firewall=y
          # CONFIG_PACKAGE_firewall4 is not set
          CONFIG_PACKAGE_iptables=y
          # 本树的 iptables 包提供 iptables-zz-legacy 别名
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-socket=y
          CONFIG_PACKAGE_iptables-mod-iprange=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-ipt-tproxy=y
          CONFIG_PACKAGE_kmod-ipt-socket=y
          CONFIG_PACKAGE_kmod-ipt-physdev=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_dnsmasq_full_ipset=y
          # CONFIG_PACKAGE_dnsmasq is not set

          # 二层桥接流量进入 iptables，以及按物理桥端口匹配的工具
          CONFIG_PACKAGE_kmod-br-netfilter=y
          CONFIG_PACKAGE_iptables-mod-physdev=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y

          # 初期验证透明代理时不使用 TurboACC 自动配置加速
          # CONFIG_PACKAGE_luci-app-turboacc is not set

          # ZeroTier（需要 TUN）
          CONFIG_PACKAGE_luci-app-zerotier=y
          CONFIG_PACKAGE_zerotier=y
          CONFIG_PACKAGE_kmod-tun=y
          EOF
          #
          # ========================修改 LAN IP============================
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-ipaddr <<'EOF'
          #!/bin/sh
          uci set network.lan.ipaddr='10.1.1.99'
          uci commit network
          EOF
          chmod +x files/etc/uci-defaults/99-custom-ipaddr
          # ========================IP 修改结束=============================
          #
          sed -i 's/^[ \t]*//g' ./.config
          make defconfig

      - name: Save configuration before verification
        run: |
          mkdir -p build-config
          cp .config build-config/config.after-defconfig
          ./scripts/diffconfig.sh > build-config/config.after-defconfig.diff

      - name: Upload configuration before verification
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_version.outputs.VERSION }}-before-verification
          path: |
            build-config/config.after-defconfig
            build-config/config.after-defconfig.diff

      - name: Verify bridge proxy configuration
        run: |
          # Kconfig may silently drop unavailable packages; fail before compiling.
          for option in \
            PACKAGE_luci-app-passwall \
            PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy \
            PACKAGE_luci-app-passwall_INCLUDE_Xray \
            PACKAGE_xray-core \
            PACKAGE_firewall \
            PACKAGE_iptables \
            PACKAGE_iptables-mod-tproxy \
            PACKAGE_iptables-mod-socket \
            PACKAGE_iptables-mod-iprange \
            PACKAGE_iptables-mod-conntrack-extra \
            PACKAGE_kmod-ipt-nat \
            PACKAGE_kmod-ipt-tproxy \
            PACKAGE_kmod-ipt-socket \
            PACKAGE_kmod-ipt-physdev \
            PACKAGE_kmod-br-netfilter \
            PACKAGE_kmod-tun \
            PACKAGE_iptables-mod-physdev \
            PACKAGE_ip-full \
            PACKAGE_ip-bridge \
            PACKAGE_ipset \
            PACKAGE_dnsmasq-full \
            PACKAGE_dnsmasq_full_ipset; do
            if ! grep -qx "CONFIG_${option}=y" .config; then
              echo "::error::Required option missing after make defconfig: CONFIG_${option}=y"
              exit 1
            fi
          done
          for package in firewall4 luci-app-ssr-plus luci-app-turboacc; do
            if grep -Eq "^CONFIG_PACKAGE_${package}=(y|m)$" .config; then
              echo "::error::Unexpected package enabled: ${package}"
              exit 1
            fi
          done
          mkdir -p build-config
          cp .config build-config/config.full
          ./scripts/diffconfig.sh > build-config/config.seed
          cp feeds.conf.default build-config/feeds.conf.default
          git rev-parse HEAD > build-config/lede.commit
          for feed in feeds/*; do
            if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
              printf '%s %s\n' "$feed" "$(git -C "$feed" rev-parse HEAD)"
            fi
          done > build-config/feeds.commits

      - name: Upload build configuration
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_version.outputs.VERSION }}-config
          path: build-config/

      - name: Make download
        run: |
          make download -j$(nproc) || make download -j1 V=s
          find ./dl/ -size -1024c -exec rm -f {} \;
          df -h

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: find ./bin/targets/ -type d -name "packages" | xargs rm -rf

      - name: Debug Files
        run: |
          echo "Files in ./bin/targets/ (including subdirectories):"
          ls -alR ./bin/targets/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_version.outputs.VERSION }}
          path: |
            ./bin/targets/**/*

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./bin/targets/**/*
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
